name: Win Runner Interactive Debug

# Temporary workflow for Wave 11 real-Windows validation.
# Removed after the debug session finishes.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build run id to pull the noffmpeg artifact from'
        required: false
        default: '43072973113'
      hold_minutes:
        description: 'Minutes to keep the runner alive for debugging'
        required: false
        default: '25'

permissions:
  contents: read
  actions: read

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_TEMP=$env:RUNNER_TEMP"
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"

      - name: Fetch and unpack the noffmpeg build
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'win-runner-debug' }
          $arts = Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$repo/actions/runs/$env:BUILD_RUN_ID/artifacts"
          $a = $arts.artifacts | Where-Object { $_.name -eq 'QwenASR-WebView-Windows-x64-noffmpeg' } | Select-Object -First 1
          if (-not $a) { throw "noffmpeg artifact not found in run $env:BUILD_RUN_ID" }
          Write-Host "artifact id=$($a.id) size=$($a.size_in_bytes)"
          $dst = Join-Path $env:RUNNER_TEMP 'qwen-pkg'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $zip1 = Join-Path $dst 'artifact.zip'
          & curl.exe -sL --fail --retry 2 -H "Authorization: Bearer $env:GH_TOKEN" -o $zip1 "https://api.github.com/repos/$repo/actions/artifacts/$($a.id)/zip"
          if ($LASTEXITCODE -ne 0) { throw "curl failed with $LASTEXITCODE" }
          $l1 = Join-Path $dst 'layer1'
          Expand-Archive -Path $zip1 -DestinationPath $l1 -Force
          $inner = Get-ChildItem $l1 -Filter *.zip | Select-Object -First 1
          if (-not $inner) { throw 'inner release zip missing' }
          $app = Join-Path $dst 'app'
          Expand-Archive -Path $inner.FullName -DestinationPath $app -Force
          Write-Host "APP_DIR=$app"
          Get-ChildItem $app | Select-Object -First 12 Name, Length | Format-Table

      - name: Open Upterm WSS session (detached)
        id: upterm
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: 'false'
          allow-exec: 'true'
          detached: 'true'
          wait-timeout-minutes: '30'
          upterm-server: wss://uptermd.upterm.dev
          known-hosts: '@cert-authority [uptermd.upterm.dev]:443 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICiecex8Dq718eSe1CCLgLvDmI7AagvCtax7brPFWkh4'

      - name: Publish connection info
        shell: pwsh
        env:
          SSH_CMD: ${{ steps.upterm.outputs.ssh-command }}
          SSH_CFG: ${{ steps.upterm.outputs.ssh-config }}
          JOIN_CMD: ${{ steps.upterm.outputs.join-command }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = Join-Path $env:RUNNER_TEMP 'conn'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $f = Join-Path $dst 'connection.txt'
          $lines = @('SSH_CMD=' + $env:SSH_CMD,
                     'JOIN_CMD=' + $env:JOIN_CMD,
                     '--- SSH_CONFIG ---',
                     $env:SSH_CFG)
          [System.IO.File]::WriteAllText($f, ($lines -join "`n"), [System.Text.UTF8Encoding]::new($false))
          Get-Content $f
          Write-Host "CONNECTION_FILE=$f"

      - name: Upload connection info
        uses: actions/upload-artifact@v4
        with:
          name: win-debug-connection
          path: ${{ runner.temp }}/conn/connection.txt
          retention-days: 1
          if-no-files-found: error

      - name: Hold runner for debugging
        shell: pwsh
        run: |
          $mins = [int]'${{ inputs.hold_minutes }}'
          Write-Host "Debug session active; holding runner for $mins minutes."
          Start-Sleep -Seconds ($mins * 60)
          Write-Host "Hold finished."
