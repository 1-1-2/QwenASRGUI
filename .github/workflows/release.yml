name: Build Windows Release

# Comments are in English per the repository language convention.
#
# Output: a ZIP that runs after extraction, laid out as onedir (Wave 3 / G2):
# QwenASR-WebView.exe on top plus _internal/ holding every dependency. The
# launcher no longer unpacks ~200 MB to %TEMP% on each start.
#
# Triggers:
#   - Manual "Run workflow" uploads an Actions artifact; optionally create a
#     permanent Release. This is the primary, deliberate build entry point.
#   - Pushing a v* tag builds and creates a Release automatically.
#
# Runner economy:
#   - No push-to-branch trigger at all: routine commits never build a 200 MB
#     Windows artifact. Only a deliberate manual run or a version tag does.
#   - `concurrency` groups runs by ref; cancel-in-progress is FALSE because
#     cancelling a release build halfway leaves a broken/empty Release.
#   - A second manual run on the same ref waits for the previous one instead
#     of competing for the same tag and artifact name.

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (blank -> 2.0.0-longform.<short sha>)'
        required: false
        default: ''
      bundle_ffmpeg:
        description: 'Bundle ffmpeg.exe (failure does not block the build)'
        type: boolean
        default: true
      run_tests:
        description: 'Run regression tests before packaging'
        type: boolean
        default: true
      create_release:
        description: 'Also create a GitHub Release (permanent download link)'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (manual + create_release only; blank = auto)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64 EXE and distribution ZIP
    runs-on: windows-latest
    timeout-minutes: 90

    # Windows runner stdout defaults to cp1252; Chinese print() used to raise
    # UnicodeEncodeError on the very first build. Force UTF-8 for every step.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Resolve version and short sha
        id: ver
        shell: bash
        env:
          INPUT_VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set +e
          python tools/resolve_version.py > /tmp/ver.log 2>&1
          code=$?
          cat /tmp/ver.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=version-log-b64::$(base64 -w0 /tmp/ver.log)"
          fi
          exit "$code"

      - name: Install runtime and build dependencies
        # requirements.txt is the minimal runtime set; packaging needs the
        # extra list below (kept in sync with build_venv.bat / build_webview.bat,
        # and deliberately free of PyTorch).
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # scipy 刻意不装：说话人聚类已换成 cluster_core.py，重采样换成
          # 频域低通。构建机没有 scipy，任何残留的 import 都会在测试或
          # PyInstaller 分析阶段直接报错，而不是悄悄多带 69 MB 进包。
          python -m pip install \
            pyinstaller pywebview pythonnet clr_loader certifi segno \
            soxr soundfile kaldi-native-fbank tokenizers \
            bottle proxy_tools psutil

      - name: Verify dependencies and absence of PyTorch
        shell: bash
        run: |
          python -c "import PyInstaller, openvino, onnxruntime, numpy, webview, opencc, kaldi_native_fbank, customtkinter; print('All runtime and build dependencies ready')"
          python -c "import importlib.util as u; print('torch present:', u.find_spec('torch') is not None)"
          # 这一条是本次瘦身的守卫：scipy 必须真的不存在，否则包会默默胖 69 MB
          python -c "import importlib.util as u, sys; assert u.find_spec('scipy') is None, 'scipy 出现在构建环境里，说明还有代码依赖它'; print('scipy absent as intended')"

      - name: Ensure bundled Silero VAD model
        shell: bash
        run: |
          if [ -f ov_models/silero_vad_v4.onnx ] && [ "$(stat -c %s ov_models/silero_vad_v4.onnx)" -gt 100000 ]; then
            echo "Repository already provides ov_models/silero_vad_v4.onnx"
          else
            echo "VAD model missing; downloading from upstream..."
            python -c "from pathlib import Path; from downloader import _download_file, _VAD_URL; p=Path('ov_models'); p.mkdir(exist_ok=True); _download_file(_VAD_URL, p/'silero_vad_v4.onnx')"
          fi
          python -c "from pathlib import Path; p=Path('ov_models/silero_vad_v4.onnx'); print('VAD size:', p.stat().st_size, 'bytes'); assert p.stat().st_size > 100000"

      - name: Regression tests before packaging
        if: ${{ inputs.run_tests != false }}
        shell: bash
        run: |
          set +e
          # Run EVERY suite and aggregate failures. Two earlier shapes were both
          # wrong: a brace-group with `code=$?` only reported the last command's
          # exit code (hiding Windows-only failures), and an &&-chain stopped at
          # the first failure (hiding everything after it). This loop prints a
          # compact PASS/FAIL summary and fails the build if ANY suite failed.
          : > /tmp/tests.log
          failed=""
          run_suite() {
            name="$1"; shift
            echo "===== $name =====" >> /tmp/tests.log 2>&1
            if "$@" >> /tmp/tests.log 2>&1; then
              echo "PASS  $name"
            else
              echo "FAIL  $name"
              failed="$failed $name"
            fi
          }
          run_suite "fixture" python tests/make_fixture.py --minutes 0.5
          run_suite "wave1" python tests/test_wave1.py
          run_suite "wave15" python tests/test_wave15.py
          run_suite "wave2" python tests/test_wave2.py
          run_suite "layout" python tests/test_layout.py
          run_suite "release_manifest" python tests/test_release_manifest.py
          run_suite "verify_package" python tests/test_verify_package.py
          run_suite "batch_queue" python tests/test_batch_queue.py
          run_suite "ui_ops" python tests/test_ui_ops.py
          run_suite "wave5" python tests/test_wave5.py
          run_suite "docs" python tests/test_docs.py
          run_suite "integration" python tests/test_integration.py
          run_suite "longform_runner" python tests/test_longform_runner.py \
            --minutes 0.5 --skip-ffmpeg --real-vad ov_models/silero_vad_v4.onnx
          run_suite "launcher_stdio" python tests/test_launcher_stdio.py
          run_suite "webview_bundle" python tests/test_webview_bundle.py
          run_suite "openvino_slim" python tests/test_openvino_slim.py
          run_suite "cluster" python tests/test_cluster.py
          run_suite "release_env" python tests/test_release_env.py
          echo "----- last 120 lines of /tmp/tests.log -----"
          tail -120 /tmp/tests.log
          if [ -n "$failed" ]; then
            echo "::error title=failed-suites::$failed"
            echo "::error title=tests-log-b64::$(base64 -w0 /tmp/tests.log)"
            exit 1
          fi
          echo "All pre-package regressions passed"
          exit 0

      - name: Download optional ffmpeg.exe
        if: ${{ inputs.bundle_ffmpeg != false }}
        continue-on-error: true
        shell: bash
        run: python tools/fetch_ffmpeg.py --out ffmpeg/ffmpeg.exe

      - name: Detect bundled ffmpeg
        id: ff
        shell: bash
        run: |
          if [ -f ffmpeg/ffmpeg.exe ] && [ "$(stat -c %s ffmpeg/ffmpeg.exe)" -gt 1000000 ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "Bundling ffmpeg.exe"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "No bundled ffmpeg.exe (WAV unaffected; video triggers auto-download)"
          fi

      - name: Build onedir package and assemble the distribution ZIP
        shell: bash
        run: |
          set +e
          FF_ARG=""
          if [ "${{ steps.ff.outputs.has }}" = "true" ]; then
            FF_ARG="--ffmpeg ffmpeg/ffmpeg.exe"
          fi
          python build_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            --sha "${{ steps.ver.outputs.sha }}" $FF_ARG \
            --noffmpeg-variant > /tmp/build.log 2>&1
          code=$?
          tail -120 /tmp/build.log
          if [ "$code" -ne 0 ]; then
            tail -200 /tmp/build.log > /tmp/build_tail.log
            echo "::error title=build-log-b64::$(base64 -w0 /tmp/build_tail.log)"
          fi
          exit "$code"

      - name: Verify package contents
        # Critical: confirm the launcher and its _internal/ payload are both in
        # the staged folder. In onedir a missing module fails at first use, not
        # at startup, so this is the build's hard gate.
        shell: bash
        run: |
          set +e
          python tools/verify_package.py > /tmp/verify.log 2>&1
          code=$?
          cat /tmp/verify.log
          if [ "$code" -ne 0 ]; then
            echo "::error title=verify-log-b64::$(base64 -w0 /tmp/verify.log)"
          fi
          exit "$code"

      - name: Smoke test the packaged launcher in place
        # 这一步才是真正的「打得开吗」。前面所有步骤都只看文件清单，
        # 而 2026-11-11 那次崩溃（缺 ui_text.py → WebViewServer=None →
        # TypeError: 'NoneType' object is not callable）恰好能通过所有清单校验。
        # 这里把 ZIP 解开、用真实 exe 跑 --selftest，再真启动一次 GUI，
        # 检查端口是否绑定、有没有 crash.log、进程有没有提前退出。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $zips = Get-ChildItem release_pkg/*.zip
          $failed = @()
          foreach ($z in $zips) {
            Write-Host "===== smoke: $($z.Name) ($([math]::Round($z.Length/1MB,1)) MB) ====="
            $log = Join-Path $env:RUNNER_TEMP ("smoke_" + [IO.Path]::GetFileNameWithoutExtension($z.Name) + ".log")
            python tools/smoke_test.py $z.FullName --wait 45 *>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
              $failed += $z.Name
              $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($log))
              Write-Host "::error title=smoke-failed:$($z.Name)::$b64"
            }
            # 两次之间留点时间让单实例锁与端口彻底释放
            Start-Sleep -Seconds 3
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error title=smoke-summary::失败的包：$($failed -join ', ')"
            exit 1
          }
          Write-Host "in-place smoke test passed for $($zips.Count) package(s)"

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke_*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenASR-WebView-Windows-x64
          path: release_pkg/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (optional)
        if: ${{ inputs.create_release == true || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v{0}', steps.ver.outputs.version)) }}
          name: QwenASR Longform ${{ steps.ver.outputs.version }}
          body: |
            ## Windows portable build

            Download `QwenASR-WebView_..._windows-x64.zip`, extract it and
            double-click `QwenASR-WebView.exe`. **No Python installation needed.**

            - Pure CPU + OpenVINO INT8, no PyTorch / transformers, no NVIDIA GPU
            - Long-audio streaming: incremental writes, resume, cancel keeps subtitles
            - Frontend assets, Mel filters and Silero VAD model are bundled
            - **Recognition weights are NOT bundled** (0.6B ~1.2GB / 1.7B ~4.4GB):
              download on demand from the Model page; hf-mirror is available
              for mainland China networks. Fully offline afterwards.
            - Bundled ffmpeg: see `使用说明.txt`; WAV input needs no ffmpeg

            See `使用说明.txt` and `build_manifest.json` for details and limits.
          files: release_pkg/*.zip
          draft: false
          prerelease: false

      - name: Write download summary
        shell: bash
        run: |
          {
            echo "## Build complete"
            echo ""
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Bundled ffmpeg: \`${{ steps.ff.outputs.has }}\`"
            echo "- Download: Actions -> Artifacts -> QwenASR-WebView-Windows-x64"
            if [ "${{ inputs.create_release == true || github.event_name == 'push' }}" = "true" ]; then
              echo "- Permanent link: this repository's Releases page"
            fi
            echo ""
            echo "> Recognition weights are not bundled; see 使用说明.txt."
          } >> "$GITHUB_STEP_SUMMARY"
