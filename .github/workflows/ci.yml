name: Longform Runner CI

# Comments are in English per the repository language convention.
# Only the scheduling-layer regression tests run here: no OpenVINO weights,
# no Windows WebView2 runtime required.
#
# Runner economy:
#   - `paths` filters keep docs-only / image-only commits from starting a run.
#   - `concurrency` cancels an in-progress run when a newer commit lands on
#     the same ref, so rapid successive pushes consume at most one runner.
#   - push is limited to `main`; feature branches are covered by pull_request,
#     which avoids the classic "push + PR" double run on the same commit.
#   - `[skip ci]` in the commit message suppresses the job entirely.
#   - `workflow_dispatch` is kept as the explicit manual trigger.

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'models.json'
      - 'webview/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.py'
      - 'models.json'
      - 'webview/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Fixture length in minutes (default 4.9)'
        required: false
        default: '4.9'
      skip_ffmpeg:
        description: 'Skip installing ffmpeg (exercise the stdlib WAV fallback)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  longform-test:
    name: Longform runner regression
    runs-on: ubuntu-latest
    if: >-
      ${{ !contains(github.event.head_commit.message || '', '[skip ci]') &&
          github.event.pull_request.draft != true }}
    env:
      FIXTURE_MINUTES: ${{ inputs.minutes || '4.9' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        # Tests only need numpy; ffmpeg validates the real streaming decode path.
        run: python -m pip install --upgrade pip numpy

      - name: Install ffmpeg
        if: ${{ inputs.skip_ffmpeg != true }}
        # ubuntu-latest does not guarantee ffmpeg; install explicitly.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Print environment
        run: |
          python -c "import sys; print('Python', sys.version)"
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          else
            echo "ffmpeg absent; WAV input will use the stdlib fallback"
          fi

      - name: Syntax check
        run: |
          python -m compileall -q \
            longform_runner.py webview_backend.py webview_server.py \
            model_catalog.py downloader.py cli_mode.py \
            tests/make_fixture.py tests/test_longform_runner.py \
            tests/test_integration.py tests/test_wave1.py \
            tests/test_wave15.py tests/test_wave2.py \
            app_webview.py build_release.py version.py tests/test_wave34.py

      - name: Frontend syntax check
        run: |
          for f in webview/js/*.js; do node --check "$f"; done

      - name: Wave 1 regression (duration probe / fingerprint / VAD resume)
        # Self-contained: generates its own WAV, no fixture or model needed.
        run: python tests/test_wave1.py

      - name: Wave 1.5 regression (streaming / peaks / preview / pagination)
        run: python tests/test_wave15.py

      - name: Wave 2 regression (catalog / L1 download / L2 manifest)
        # Local HTTP server only; never touches Hugging Face or model weights.
        run: python tests/test_wave2.py

      - name: Wave 3/4 regression (window / persistence / live subtitles)
        # Pure static + mock Runner checks; no GUI, no .NET, no model weights.
        run: python tests/test_wave34.py

      - name: Generate public-domain test audio
        # Fixtures are committed and concatenated offline; no network, no token.
        run: python tests/make_fixture.py --minutes "$FIXTURE_MINUTES"

      - name: Backend integration tests
        run: |
          set +e
          python tests/test_integration.py > /tmp/integration.log 2>&1
          code=$?
          cat /tmp/integration.log
          if [ "$code" -ne 0 ]; then
            # Per-line ::error:: is capped at 10 annotations per step, so ship
            # the whole log in one base64 annotation for remote debugging.
            echo "::error title=integration-log-b64::$(base64 -w0 /tmp/integration.log)"
          fi
          exit "$code"

      - name: Longform runner tests (real ffmpeg streaming decode)
        run: |
          args="--minutes $FIXTURE_MINUTES"
          if ! command -v ffmpeg >/dev/null 2>&1; then args="$args --skip-ffmpeg"; fi
          python tests/test_longform_runner.py $args
