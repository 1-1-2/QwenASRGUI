name: Longform Runner CI

# Comments are in English per the repository language convention.
# Only the scheduling-layer regression tests run here: no OpenVINO weights,
# no Windows WebView2 runtime required.
#
# Runner economy:
#   - `paths` filters keep docs-only / image-only commits from starting a run.
#   - `concurrency` cancels an in-progress run when a newer commit lands on
#     the same ref, so rapid successive pushes consume at most one runner.
#   - push is limited to `main`; feature branches are covered by pull_request,
#     which avoids the classic "push + PR" double run on the same commit.
#   - `[skip ci]` in the commit message suppresses the job entirely.
#   - `workflow_dispatch` is kept as the explicit manual trigger.

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'models.json'
      - 'webview/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.py'
      - 'models.json'
      - 'webview/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Fixture length in minutes (default 4.9)'
        required: false
        default: '4.9'
      skip_ffmpeg:
        description: 'Skip installing ffmpeg (exercise the stdlib WAV fallback)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  longform-test:
    name: Longform runner regression
    runs-on: ubuntu-latest
    if: >-
      ${{ !contains(github.event.head_commit.message || '', '[skip ci]') &&
          github.event.pull_request.draft != true }}
    env:
      FIXTURE_MINUTES: ${{ inputs.minutes || '4.9' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        # Tests only need numpy; ffmpeg validates the real streaming decode path.
        # scipy 只用于 tests/test_cluster.py 的「自写聚类 vs SciPy」对拍 ——
        # 发布包不含 SciPy（见 release.yml），这里装上是为了证明换实现后
        # 输出仍逐位一致。
        run: python -m pip install --upgrade pip numpy scipy

      - name: Install ffmpeg
        if: ${{ inputs.skip_ffmpeg != true }}
        # ubuntu-latest does not guarantee ffmpeg; install explicitly.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Print environment
        run: |
          python -c "import sys; print('Python', sys.version)"
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          else
            echo "ffmpeg absent; WAV input will use the stdlib fallback"
          fi

      - name: Syntax check
        run: |
          python -m compileall -q \
            longform_runner.py webview_backend.py webview_server.py \
            model_catalog.py downloader.py cli_mode.py \
            tests/make_fixture.py tests/test_longform_runner.py \
            tests/test_integration.py tests/test_wave1.py \
            tests/test_wave15.py tests/test_wave2.py \
            app_webview.py build_release.py version.py tests/test_wave34.py \
            tests/test_postprocess.py postprocess.py app_paths.py \
            tests/test_layout.py batch_queue.py single_instance.py run_log.py \
            subtitle_extras.py release_manifest.py tests/test_batch_queue.py \
            tests/test_batch_api.py tests/test_ui_ops.py tests/test_wave5.py \
            tests/test_out_naming.py \
            tests/test_release_manifest.py tests/test_docs.py \
            ui_text.py downloader.py tests/test_i18n_contract.py \
            tests/test_punct_contract.py tools/gen_download_doc.py \
            tools/verify_package.py tests/test_verify_package.py \
            tests/test_launcher_stdio.py tests/test_webview_bundle.py \
            tests/test_openvino_slim.py cluster_core.py tests/test_cluster.py \
            tools/smoke_test.py tests/test_release_env.py tools/gh_download.py \
            tests/test_smoke_selftest.py

      - name: Frontend syntax check
        run: |
          for f in webview/js/*.js; do node --check "$f"; done

      - name: Wave 1 regression (duration probe / fingerprint / VAD resume)
        # Self-contained: generates its own WAV, no fixture or model needed.
        run: python tests/test_wave1.py

      - name: Wave 1.5 regression (streaming / peaks / preview / pagination)
        run: python tests/test_wave15.py

      - name: Release-environment import chain (no tkinter / customtkinter / scipy)
        # 本地等价于「打包版能不能起来」：把发行包刻意不带的库全部封掉，
        # 再 import 启动器的整条依赖链。2026-11-11 的两次启动崩溃都能在
        # 这里提前复现，不必等 Windows 构建。
        run: python tests/test_release_env.py

      - name: Smoke-test harness self check
        # 冒烟测试是发布的最后一闸。它自己判错就是「假绿放行坏包」或
        # 「假红逼人绕闸」，所以它的诊断/判定逻辑也要有测试。
        run: python tests/test_smoke_selftest.py

      - name: Clustering / resampling regression (self-written vs SciPy)
        # 本次瘦身的前提：cluster_core 与 scipy 输出逐位一致、频域重采样
        # 不产生混叠。断言失败就意味着不能去掉那 69 MB。
        run: python tests/test_cluster.py

      - name: Wave 2 regression (catalog / L1 download / L2 manifest)
        # Local HTTP server only; never touches Hugging Face or model weights.
        run: python tests/test_wave2.py

      - name: Wave 3 regression (onedir layered path resolution)
        # Fakes sys.frozen/_MEIPASS and rebuilds the three layouts; asserts user
        # data stays beside the launcher and shipped resources under _internal/.
        run: python tests/test_layout.py

      - name: Wave 3 regression (manifest / delta / smooth upgrade / rollback)
        run: python tests/test_release_manifest.py

      - name: Wave 3 regression (staged package layout contract)
        # Guards the ov_models/ dual-purpose rule: shipped VAD/mel resources
        # belong in _internal/ov_models/, user data must stay beside the
        # launcher. A plain name-based ban once broke the Windows build.
        run: python tests/test_verify_package.py

      - name: Wave 7 regression (windowed launcher / no console)
        # The windowed EXE has sys.stdout = sys.stderr = None; an unguarded
        # flush() there crashed the release build at exit.
        run: python tests/test_launcher_stdio.py

      - name: Wave 7 regression (WebView bundle excludes the Tk GUI)
        run: python tests/test_webview_bundle.py

      - name: Wave 7 regression (OpenVINO slimming keeps CPU inference)
        run: python tests/test_openvino_slim.py

      - name: Wave 4 regression (server-side batch queue)
        run: |
          python tests/test_batch_queue.py
          python tests/test_batch_api.py

      - name: Wave 4 regression (single instance / run log / UI state / i18n)
        run: python tests/test_ui_ops.py

      - name: Wave 5 regression (punctuation / handout / TLS warning)
        run: python tests/test_wave5.py

      - name: Output naming policy (suffix / overwrite / hash + resume memory)
        # 「同名檔案」三種策略，以及續跑要靠 checkpoint.out_name 寫回同一份。
        # 沒有這道閘，suffix 策略每次續跑都會多出一個 (1)、(2)。
        run: python tests/test_out_naming.py

      - name: Wave 6 regression (bilingual docs / generated artefacts)
        run: python tests/test_docs.py

      - name: H6/H7 + C1 contract regressions
        # i18n contract loads the real i18n.js in Node and probes the real
        # backend APIs; punct contract asserts resume == full run byte for byte.
        run: |
          python tests/test_i18n_contract.py
          python tests/test_punct_contract.py

      - name: Wave 3/4 regression (window / persistence / live subtitles)
        # Pure static + mock Runner checks; no GUI, no .NET, no model weights.
        run: python tests/test_wave34.py

      - name: Enrichment regression (word timing / speakers / failure isolation)
        # Mock aligner and diarization engine; SRT byte-identity is asserted.
        run: python tests/test_postprocess.py

      - name: Generate public-domain test audio
        # Fixtures are committed and concatenated offline; no network, no token.
        run: python tests/make_fixture.py --minutes "$FIXTURE_MINUTES"

      - name: Backend integration tests
        run: |
          set +e
          python tests/test_integration.py > /tmp/integration.log 2>&1
          code=$?
          cat /tmp/integration.log
          if [ "$code" -ne 0 ]; then
            # Per-line ::error:: is capped at 10 annotations per step, so ship
            # the whole log in one base64 annotation for remote debugging.
            echo "::error title=integration-log-b64::$(base64 -w0 /tmp/integration.log)"
          fi
          exit "$code"

      - name: Longform runner tests (real ffmpeg streaming decode)
        run: |
          args="--minutes $FIXTURE_MINUTES"
          if ! command -v ffmpeg >/dev/null 2>&1; then args="$args --skip-ffmpeg"; fi
          python tests/test_longform_runner.py $args
